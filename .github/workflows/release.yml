name: Build and release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Build embedded frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Upload embedded frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  macos:
    name: Build macOS Universal DMG & CLI
    needs: frontend
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download embedded frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build Darwin binaries & Universal Binary
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X 'local-finance/internal/updater.CurrentVersion=${{ github.ref_name }}'" -o dist/local-finance-arm64 ./cmd/server/main.go
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X 'local-finance/internal/updater.CurrentVersion=${{ github.ref_name }}'" -o dist/local-finance-amd64 ./cmd/server/main.go
          lipo -create -output dist/LocalFinance dist/local-finance-arm64 dist/local-finance-amd64
          chmod +x dist/LocalFinance
          rm -f dist/local-finance-arm64 dist/local-finance-amd64

      - name: Package macOS Application and DMG
        run: |
          APP_NAME="LocalFinance.app"
          APP_PATH="dist/${APP_NAME}"
          mkdir -p "${APP_PATH}/Contents/MacOS"
          mkdir -p "${APP_PATH}/Contents/Resources"
          cp dist/LocalFinance "${APP_PATH}/Contents/MacOS/LocalFinance"
          cp packaging/macos/Info.plist "${APP_PATH}/Contents/Info.plist"
          if [ -f packaging/macos/AppIcon.icns ]; then
            cp packaging/macos/AppIcon.icns "${APP_PATH}/Contents/Resources/AppIcon.icns"
          fi
          
          # Inject version into Info.plist if built from tag
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            sed -i '' "s/1.0.0/${VERSION}/g" "${APP_PATH}/Contents/Info.plist"
          fi

          # Prepare DMG staging folder with Applications symlink
          STAGING="dmg_staging"
          mkdir -p "${STAGING}"
          cp -R "${APP_PATH}" "${STAGING}/"
          ln -s /Applications "${STAGING}/Applications"

          # Calculate folder size and add buffer for filesystem structures
          SRC_SIZE_MB=$(du -sm "${STAGING}" | cut -f1)
          IMG_SIZE_MB=$(( SRC_SIZE_MB * 2 + 50 ))

          # Create compressed DMG
          hdiutil create -volname "LocalFinance" -srcfolder "${STAGING}" -ov -format UDZO -fs HFS+ -size "${IMG_SIZE_MB}m" "dist/LocalFinance.dmg"
          rm -rf "${STAGING}"

      - name: Package macOS CLI Archive
        run: |
          mkdir -p cli_staging
          cp dist/LocalFinance cli_staging/local-finance
          tar -C cli_staging -czf dist/local-finance-darwin-universal.tar.gz local-finance
          rm -rf cli_staging

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-dmg
          path: dist/LocalFinance.dmg
          if-no-files-found: error

      - name: Upload Darwin CLI
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-cli
          path: dist/local-finance-darwin-universal.tar.gz
          if-no-files-found: error

  windows:
    name: Build Windows executable
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download embedded frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build Windows binary
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          go build -trimpath -ldflags="-s -w -X 'local-finance/internal/updater.CurrentVersion=${{ github.ref_name }}'" -o dist/LocalFinance.exe ./cmd/server/main.go

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-exe
          path: dist/LocalFinance.exe
          if-no-files-found: error

  linux:
    name: Build Linux ${{ matrix.goarch }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            archive: local-finance-linux-amd64.tar.gz
          - goarch: arm64
            archive: local-finance-linux-arm64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download embedded frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build Linux binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          go build -trimpath -ldflags="-s -w -X 'local-finance/internal/updater.CurrentVersion=${{ github.ref_name }}'" -o dist/local-finance ./cmd/server/main.go

      - name: Package Linux tarball
        run: |
          tar -C dist -czf "dist/${{ matrix.archive }}" local-finance

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.goarch }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum * > /tmp/checksums.txt
          mv /tmp/checksums.txt checksums.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* --clobber
          else
            gh release create "${TAG}" release-assets/* --generate-notes --verify-tag
          fi
