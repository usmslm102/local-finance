name: Build and release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-check:
    name: Verify portable backend
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: mkdir -p frontend/dist && touch frontend/dist/index.html
      - run: go test ./... && go vet ./...

  frontend:
    name: Build embedded frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm lint && pnpm test && pnpm build

      - name: Upload embedded frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  macos:
    name: Build macOS Universal DMG & CLI
    needs: frontend
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download embedded frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build Darwin binaries & Universal Binary
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X 'local-finance/internal/updater.CurrentVersion=${VERSION}'" -o dist/local-finance-arm64 ./cmd/server/main.go
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X 'local-finance/internal/updater.CurrentVersion=${VERSION}'" -o dist/local-finance-amd64 ./cmd/server/main.go
          lipo -create -output dist/LocalFinance dist/local-finance-arm64 dist/local-finance-amd64
          chmod +x dist/LocalFinance
          # Sign every architecture after combining the Go executables.
          codesign --force --sign - --identifier com.localfinance.cli dist/LocalFinance
          codesign --verify --strict --all-architectures --verbose=2 dist/LocalFinance
          dist/LocalFinance -h
          rm -f dist/local-finance-arm64 dist/local-finance-amd64

      - name: Package macOS Application and DMG
        run: |
          APP_NAME="LocalFinance.app"
          APP_PATH="dist/${APP_NAME}"
          mkdir -p "${APP_PATH}/Contents/MacOS"
          mkdir -p "${APP_PATH}/Contents/Resources"
          cp dist/LocalFinance "${APP_PATH}/Contents/MacOS/LocalFinance"
          cp packaging/macos/Info.plist "${APP_PATH}/Contents/Info.plist"
          if [ -f packaging/macos/AppIcon.icns ]; then
            cp packaging/macos/AppIcon.icns "${APP_PATH}/Contents/Resources/AppIcon.icns"
          fi
          
          # Inject version into Info.plist if built from tag
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            sed -i '' "s/1.0.0/${VERSION}/g" "${APP_PATH}/Contents/Info.plist"
          fi

          # Seal the complete bundle after setting its version and resources.
          codesign --force --sign - "${APP_PATH}"
          codesign --verify --deep --strict --all-architectures --verbose=2 "${APP_PATH}"
          "${APP_PATH}/Contents/MacOS/LocalFinance" -h

          # Prepare DMG staging folder with Applications symlink
          STAGING="dmg_staging"
          mkdir -p "${STAGING}"
          cp -R "${APP_PATH}" "${STAGING}/"
          ln -s /Applications "${STAGING}/Applications"

          # Calculate folder size and add buffer for filesystem structures
          SRC_SIZE_MB=$(du -sm "${STAGING}" | cut -f1)
          IMG_SIZE_MB=$(( SRC_SIZE_MB * 2 + 50 ))

          # Create compressed DMG
          hdiutil create -volname "LocalFinance" -srcfolder "${STAGING}" -ov -format UDZO -fs HFS+ -size "${IMG_SIZE_MB}m" "dist/LocalFinance.dmg"
          rm -rf "${STAGING}"

      - name: Package macOS CLI Archive
        run: |
          mkdir -p cli_staging
          cp dist/LocalFinance cli_staging/local-finance
          tar -C cli_staging -czf dist/local-finance-darwin-universal.tar.gz local-finance
          # Verify the shipped archive, not only the pre-packaged executable.
          mkdir -p cli_verify
          tar -xzf dist/local-finance-darwin-universal.tar.gz -C cli_verify
          codesign --verify --strict --all-architectures --verbose=2 cli_verify/local-finance
          cli_verify/local-finance -h
          rm -rf cli_staging cli_verify

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-dmg
          path: dist/LocalFinance.dmg
          if-no-files-found: error

      - name: Upload Darwin CLI
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-cli
          path: dist/local-finance-darwin-universal.tar.gz
          if-no-files-found: error

  windows:
    name: Build Windows executable
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download embedded frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build Windows binary
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          go build -trimpath -ldflags="-s -w -X 'local-finance/internal/updater.CurrentVersion=${VERSION}'" -o dist/LocalFinance.exe ./cmd/server/main.go

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-exe
          path: dist/LocalFinance.exe
          if-no-files-found: error

  linux:
    name: Build Linux ${{ matrix.goarch }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            archive: local-finance-linux-amd64.tar.gz
          - goarch: arm64
            archive: local-finance-linux-arm64.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download embedded frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build Linux binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-v1.0.0}"
          go build -trimpath -ldflags="-s -w -X 'local-finance/internal/updater.CurrentVersion=${VERSION}'" -o dist/local-finance ./cmd/server/main.go

      - name: Package Linux tarball
        run: |
          tar -C dist -czf "dist/${{ matrix.archive }}" local-finance

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.goarch }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  desktop:
    name: Build native desktop installers
    needs: frontend
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend-check, macos, windows, linux, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum * > /tmp/checksums.txt
          mv /tmp/checksums.txt checksums.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > /tmp/localfinance-release-notes.md <<'NOTES'
          Native desktop installers include the React interface, Go backend and optional finance MCP in one application. Desktop and portable hosts use the same local ledger; quit one before opening it in the other.

          Choose artifacts containing Desktop for the native window. The portable browser/server downloads remain available. macOS requires 13+; builds are ad-hoc signed and unnotarized by default unless Developer ID credentials are configured. Windows requires WebView2 installed beforehand. Linux desktop packages require Ubuntu 24.04+ / glibc 2.39, GTK4 and WebKitGTK 6.

          Desktop updates use complete installer replacements and preserve the separately stored database. See docs/desktop-release.md in the source for installation, signing status and platform verification instructions. Verify downloads against checksums.txt. For unnotarized macOS builds, follow the Privacy & Security first-launch instructions and targeted quarantine recovery in docs/desktop-release.md.
          NOTES
          if release_draft=$(gh release view "${TAG}" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$release_draft" != true ]; then
              echo 'Published releases are immutable; choose a new version tag instead of replacing public artifacts.' >&2
              exit 1
            fi
            gh release upload "${TAG}" release-assets/* --clobber
          else
            release_args=(--generate-notes --notes-file /tmp/localfinance-release-notes.md --verify-tag --draft)
            if [[ "$TAG" == *-* ]]; then release_args+=(--prerelease); fi
            gh release create "${TAG}" release-assets/* "${release_args[@]}"
          fi
