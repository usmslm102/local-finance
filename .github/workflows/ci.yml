name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    # CGO-free builds are part of the portable application contract.
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure frontend dist placeholder for embed
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Run Go Tests
        run: go test -v ./...

      - name: Vet Go code
        run: go vet ./...

      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Lint and test frontend
        working-directory: frontend
        run: pnpm lint && pnpm test

      - name: Check frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level=high
